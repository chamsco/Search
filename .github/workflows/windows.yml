name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test
        run: dotnet test tests/Search.Core.Tests -c Release
      - name: Publish Search.exe
        run: dotnet publish src/Search.App -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o out/win-x64
      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\Search.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: Search-win-x64
          path: out/win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: Search-Setup
          path: out/Search-Setup-*.exe
      # Publishes the installer as a pre-release: on a v* tag, or when run by hand (Actions › Windows build › Run workflow).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v1.0.19-win.${{ github.run_number }}" }
          $setup = Get-ChildItem out/Search-Setup-*.exe | Select-Object -First 1
          $zip = "out/Search-win-x64-portable.zip"
          Compress-Archive -Path out/win-x64/* -DestinationPath $zip
          gh release create $tag $setup.FullName $zip --prerelease --target "${{ github.sha }}" `
            --title "Search for Windows $tag" --notes-file installer/RELEASE_NOTES.md
