<!doctype html><html><head><meta charset="utf-8"><title>Spaces</title><link rel="stylesheet" href="common.css"></head>
<body><div class="page">
  <h1>Spaces</h1><p class="sub">Each space keeps its own pins and tabs.</p>
  <div id="list"></div>
  <div class="toolbar" style="margin-top:14px"><button id="new">New space</button><button id="on" class="quiet" style="display:none">Show the spaces strip</button></div>
</div>
<script src="bridge.js"></script>
<script>
const list = document.getElementById('list');
host.on('spaces', m => {
  document.getElementById('on').style.display = m.on ? 'none' : '';
  list.innerHTML = m.items.map(s => `<div class="card${s.current ? ' on' : ''}" data-id="${s.id}" role="button" aria-label="${esc(s.name)}">
    <span class="sw" style="background:${s.colour || ''}"><i style="font:normal 12px 'Segoe Fluent Icons','Segoe MDL2 Assets'">${s.glyph}</i></span>
    <div class="main" style="flex:1;min-width:0"><div class="t">${esc(s.name)}</div><div class="u">${s.tabs < 0 ? 'Not opened in this window yet' : s.tabs + (s.tabs === 1 ? ' page' : ' pages')}${s.current ? ' · here now' : ''}</div></div></div>`).join('');
});
list.addEventListener('click', e => { const c = e.target.closest('.card'); if (c) host.send('spaces.switch', { id: c.dataset.id }); });
document.getElementById('new').onclick = () => host.send('spaces.new');
document.getElementById('on').onclick = () => host.send('spaces.on');
host.send('spaces.get');
</script></body></html>
